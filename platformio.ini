; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
[env]
build_flags = 
;   -D KYBER512
   -D KYBER768
;   -D KYBER1024
;   -D DILITHIUM2
   -D DILITHIUM3
;   -D DILITHIUM5
;   -D SPHINCS_SHA2_128FSIMPLE
;   -D SPHINCS_SHA2_128SSIMPLE
;   -D SPHINCS_SHA2_192FSIMPLE
;   -D SPHINCS_SHA2_192SSIMPLE
;   -D SPHINCS_SHA2_256FSIMPLE
;   -D SPHINCS_SHA2_256SSIMPLE
;   -D SPHINCS_SHAKE_128FSIMPLE
;   -D SPHINCS_SHAKE_128SSIMPLE
;   -D SPHINCS_SHAKE_192FSIMPLE
;   -D SPHINCS_SHAKE_192SSIMPLE
;   -D SPHINCS_SHAKE_256FSIMPLE
;   -D SPHINCS_SHAKE_256SSIMPLE
;   -D FALCON512
;   -D FALCON1024

[env:due]
platform = atmelsam
board = due
framework = arduino

[env:teensy40]
platform = teensy
board = teensy40
framework = arduino

[env:nucleo_f446re]
platform = ststm32
board = nucleo_f446re
framework = arduino

[env:nucleo_f439zi]
platform = ststm32
board = nucleo_f439zi
framework = arduino

[env:nucleo_f756zg]
platform = ststm32
board = nucleo_f756zg
framework = arduino

[env:pico]
; crash reason to be investigated
platform = raspberrypi
board = pico
build_flags = 
framework = arduino
upload_protocol = picotool
upload_port = /media/mipl/RPI-RP2
